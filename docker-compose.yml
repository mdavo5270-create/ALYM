services:
  postgres:
    image: postgres:16-alpine
    container_name: alym-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: alym
      POSTGRES_PASSWORD: alym_dev
      POSTGRES_DB: alym
    ports:
      - "5432:5432"
    volumes:
      - alym_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: alym-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  alym_pg_data:
